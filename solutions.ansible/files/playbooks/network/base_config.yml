---
# NTP and syslog baseline. Honours check mode, so a Kestra run with
# `check_mode` reports the diff without touching the device.
- name: Apply base configuration
  hosts: all
  gather_facts: false
  tasks:
    - name: Build the config lines for this platform
      ansible.builtin.set_fact:
        base_config_lines: >-
          {{ (ntp_servers | map('regex_replace', '^', 'ntp server ') | list)
             + (syslog_hosts | map('regex_replace', '^', logging_keyword ~ ' ') | list) }}
      vars:
        logging_keyword: "{{ 'logging server' if ansible_network_os == 'cisco.nxos.nxos' else 'logging host' }}"

    - name: Push base config (IOS)
      cisco.ios.ios_config:
        lines: "{{ base_config_lines }}"
      when:
        - not (kestra_simulate | bool)
        - ansible_network_os == 'cisco.ios.ios'

    - name: Push base config (NX-OS)
      cisco.nxos.nxos_config:
        lines: "{{ base_config_lines }}"
      when:
        - not (kestra_simulate | bool)
        - ansible_network_os == 'cisco.nxos.nxos'

    - name: Show the config that would be pushed (lab mode)
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} ({{ ansible_network_os }}) <- {{ base_config_lines }}"
      changed_when: true
      when: kestra_simulate | bool

    - name: Record what was applied
      ansible.builtin.set_fact:
        asset_facts:
          ntp_servers: "{{ ntp_servers | join(',') }}"
          syslog_hosts: "{{ syslog_hosts | join(',') }}"

    # Skipped in check mode, so a dry run never records config it did not push.
    - name: Publish asset metadata to Kestra
      kestra:
        outputs:
          asset_metadata: "{{ dict(ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, 'asset_facts'))) }}"
      run_once: true
      delegate_to: localhost
      when: not ansible_check_mode
