---
# Step 4: post-change checks. Fails the run if a VLAN did not land, which fails
# the Kestra execution and leaves the device assets un-stamped.
- name: Validate the rollout
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the VLAN table
      ansible.netcommon.cli_command:
        command: show vlan brief
      register: show_vlan
      when:
        - not (kestra_simulate | bool)
        - role == 'access-switch'

    - name: Every requested VLAN is present
      ansible.builtin.assert:
        that: "(item.name | string) in show_vlan.stdout"
        fail_msg: "VLAN {{ item.vlan_id }} ({{ item.name }}) missing on {{ inventory_hostname }}"
        quiet: true
      loop: "{{ vlans }}"
      when:
        - not (kestra_simulate | bool)
        - role == 'access-switch'

    - name: Publish the validated hosts to Kestra
      kestra:
        outputs:
          validated_hosts: "{{ ansible_play_hosts }}"
      run_once: true
      delegate_to: localhost
