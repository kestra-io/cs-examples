id: ansible_build_inventory
namespace: solutions.ansible
description: |
  # Ansible inventory from Kestra Assets

  The Kestra equivalent of an AWX inventory. Give it a region, role and platform
  and it returns an Ansible inventory built from the matching `NetworkDevice`
  assets, which `ansible_netbox_device_sync` keeps in step with NetBox.

  Call it as a subflow before any playbook run, so no flow ever carries an
  inventory file. Hosts are grouped by platform (`ios`, `nxos`), and each group
  sets `ansible_network_os` and `ansible_connection`. Each host also gets its
  asset's region, site, role and software version as variables, so playbooks
  can branch on them.

  Fails if nothing matches, so a typo in a filter can never become a run that
  touches no devices and reports success.

labels:
  demo: ansible-network-automation

inputs:
  - id: region
    type: STRING
    defaults: any
  - id: role
    type: STRING
    defaults: any
  - id: platform
    type: STRING
    defaults: any

tasks:
  - id: select_devices
    type: io.kestra.plugin.core.output.OutputValues
    values:
      devices: >-
        {%- set want = {'region': inputs.region, 'role': inputs.role, 'platform': inputs.platform} | toJson -%}
        {{- assets(type='io.kestra.plugin.ee.assets.NetworkDevice', namespace=flow.namespace)
            | jq('(' ~ want ~ ') as $w | [ .[]
                | select(($w.region == "any" or .metadata.region == $w.region)
                     and ($w.role == "any" or .metadata.role == $w.role)
                     and ($w.platform == "any" or .metadata.platform == $w.platform))
                | { id: .id, metadata: .metadata } ]')
            | first | toJson -}}

  - id: no_devices_matched
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ fromJson(outputs.select_devices.values.devices) | length == 0 }}"
    errorMessage: "No NetworkDevice assets in {{ flow.namespace }} match region={{ inputs.region }} role={{ inputs.role }} platform={{ inputs.platform }}. Run ansible_netbox_device_sync first."

  - id: render_inventory
    type: io.kestra.plugin.core.output.OutputValues
    values:
      inventory: >-
        {{ fromJson(outputs.select_devices.values.devices)
           | jq('[ group_by(.metadata.platform)[] | {
                 key: .[0].metadata.platform,
                 value: {
                   vars: {
                     ansible_connection: "ansible.netcommon.network_cli",
                     ansible_network_os: .[0].metadata.ansible_network_os
                   },
                   hosts: (map({
                     key: .id,
                     value: {
                       ansible_host: .metadata.mgmt_ip,
                       role: .metadata.role,
                       region: .metadata.region,
                       site: .metadata.site,
                       os_version: .metadata.os_version
                     }
                   }) | from_entries)
                 }
               } ] | from_entries | { all: { children: . } }')
           | first | toJson }}

  - id: log_inventory
    type: io.kestra.plugin.core.log.Log
    message: "Inventory for region={{ inputs.region }} role={{ inputs.role }} platform={{ inputs.platform }}: {{ outputs.render_inventory.values.inventory }}"

outputs:
  - id: inventory
    type: STRING
    description: Ansible inventory as JSON, which Ansible reads as YAML.
    value: "{{ outputs.render_inventory.values.inventory }}"
  - id: hosts
    type: STRING
    description: JSON array of the matched asset ids.
    value: "{{ fromJson(outputs.select_devices.values.devices) | jq('[ .[].id ]') | first | toJson }}"
