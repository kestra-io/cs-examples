id: ansible_job_template
namespace: solutions.ansible
description: |
  # Run one playbook from Git

  The Kestra equivalent of an AWX job template: it runs one project (Git repo),
  one playbook and one inventory. Each run clones the repo at `git_ref`, so a
  change merged to the playbook reaches the next run without editing any flow.

  Every step of `ansible_switch_rollout` calls this subflow. It retries the
  playbook up to three times, because most network failures are transient
  (SSH timeouts, AAA hiccups).

  **Lab mode** (`simulate: true`) passes `ansible_connection=local` and
  `kestra_simulate=true` to the playbooks, so they run end to end without
  reaching a device. Set `simulate: false` and create the
  `NETWORK_SSH_USERNAME` and `NETWORK_SSH_PASSWORD` secrets to target real
  switches.

labels:
  demo: ansible-network-automation

inputs:
  - id: git_url
    type: STRING
    defaults: https://github.com/kestra-io/cs-examples
  - id: git_ref
    type: STRING
    defaults: main
  - id: playbook_dir
    type: STRING
    defaults: solutions.ansible/files/playbooks/switch_rollout
  - id: playbook
    type: STRING
  - id: inventory
    type: JSON
    description: Ansible inventory, as returned by ansible_build_inventory.
  - id: extra_vars
    type: JSON
    defaults: {}
  - id: limit
    type: STRING
    description: Ansible --limit pattern.
    defaults: all
  - id: check_mode
    type: BOOL
    defaults: false
  - id: simulate
    type: BOOL
    defaults: true

tasks:
  - id: run
    type: io.kestra.plugin.core.flow.WorkingDirectory
    inputFiles:
      inventory.yml: "{{ inputs.inventory | toJson }}"
      extra_vars.json: "{{ inputs.extra_vars | toJson }}"
    # Routes the run to the workers nearest the devices, for example APAC
    # inventory to APAC workers. Requires a Worker Queue tagged with the region,
    # so it stays commented out on instances without regional worker groups.
    # workerSelector:
    #   tags:
    #     - apac
    #   fallback: WAIT
    tasks:
      - id: clone
        type: io.kestra.plugin.git.Clone
        url: "{{ inputs.git_url }}"
        branch: "{{ inputs.git_ref }}"
        directory: repo
        # For a private repo:
        # username: x-access-token
        # password: "{{ secret('GITHUB_TOKEN') }}"

      - id: playbook
        type: io.kestra.plugin.ansible.cli.AnsibleCLI
        containerImage: cytopia/ansible:latest-tools
        galaxyDependencies:
          - ansible.netcommon
          - cisco.ios
          - cisco.nxos
        checkMode: "{{ inputs.check_mode }}"
        diff: true
        limit: "{{ inputs.limit }}"
        env:
          NET_USERNAME: "{{ inputs.simulate ? 'lab' : secret('NETWORK_SSH_USERNAME') }}"
          NET_PASSWORD: "{{ inputs.simulate ? 'lab' : secret('NETWORK_SSH_PASSWORD') }}"
        retry:
          type: constant
          interval: PT15S
          maxAttempts: 3
        commands:
          - >-
            ansible-playbook -i inventory.yml repo/{{ inputs.playbook_dir }}/{{ inputs.playbook }}
            -e @extra_vars.json
            -e kestra_attempt={{ taskrun.attemptsCount }}
            {{ inputs.simulate ? '-e ansible_connection=local -e kestra_simulate=true' : '' }}

outputs:
  - id: results
    type: JSON
    description: Values the playbook declared with the `kestra` module.
    value: "{{ (outputs.playbook.vars.outputs ?? {}) | toJson }}"
