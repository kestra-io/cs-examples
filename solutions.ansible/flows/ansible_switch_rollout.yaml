id: ansible_switch_rollout
namespace: solutions.ansible
description: |
  # Switch rollout: ordered Ansible playbooks from Git

  The Kestra equivalent of an AWX workflow template. Pick the target switches
  by region, role and platform. The flow then runs these steps in order:

  1. **Inventory**: built from Kestra `NetworkDevice` assets (`ansible_build_inventory`).
  2. **Pre-check**: read-only. Records the software version running on each switch.
  3. **Approval**: optional. A human reviews the pre-check and resumes or rejects.
  4. **Change playbooks**: runs `playbooks` one at a time, in list order, from
     the Git repo. Each one is retried on failure, and the first failure stops
     the run.
  5. **Validate**: post-checks, skipped in a dry run.
  6. **Stamp assets**: writes `last_rollout` and the execution id onto every
     switch that was changed.

  Playbooks live in Git. Editing one, or changing the list order, never
  requires changing this flow.

  **Demo:** run `ansible_netbox_device_sync` once, then run this flow with the
  defaults. Lab mode needs no switches or credentials. Turn on
  `simulate_transient_failure` to watch the pre-check fail and then pass on
  retry, and turn on `require_approval` to show the approval gate.

labels:
  demo: ansible-network-automation

inputs:
  - id: region
    type: SELECT
    expression: "{{ assets(type='io.kestra.plugin.ee.assets.NetworkDevice', namespace='solutions.ansible') | jq('[\"any\"] + ([ .[].metadata.region ] | unique)') | first }}"
    defaults: any
  - id: role
    type: SELECT
    expression: "{{ assets(type='io.kestra.plugin.ee.assets.NetworkDevice', namespace='solutions.ansible') | jq('[\"any\"] + ([ .[].metadata.role ] | unique)') | first }}"
    defaults: any
  - id: platform
    type: SELECT
    expression: "{{ assets(type='io.kestra.plugin.ee.assets.NetworkDevice', namespace='solutions.ansible') | jq('[\"any\"] + ([ .[].metadata.platform ] | unique)') | first }}"
    defaults: any
  - id: playbooks
    type: ARRAY
    itemType: STRING
    description: Change playbooks, run in this order between pre-check and validate.
    defaults:
      - 02_base_config.yml
      - 03_vlans.yml
  - id: vlans
    type: JSON
    defaults:
      - {vlan_id: 110, name: USERS}
      - {vlan_id: 120, name: VOICE}
      - {vlan_id: 130, name: PRINTERS}
  - id: dry_run
    type: BOOL
    description: Run the change playbooks in Ansible check mode and show the diff. Nothing is pushed.
    defaults: false
  - id: require_approval
    type: BOOL
    description: Pause after the pre-check until someone approves the change.
    defaults: false
  - id: simulate
    type: BOOL
    description: Lab mode. Runs every playbook without connecting to a device.
    defaults: true
  - id: simulate_transient_failure
    type: BOOL
    description: Lab mode only. Fails the first pre-check attempt so the retry shows.
    defaults: false
  - id: git_ref
    type: STRING
    description: Branch of the playbook repository to run.
    defaults: main

variables:
  git_url: https://github.com/kestra-io/cs-examples
  playbook_dir: solutions.ansible/files/playbooks/switch_rollout
  extra_vars: "{{ {'vlans': inputs.vlans, 'simulate_transient_failure': inputs.simulate_transient_failure} | toJson }}"

tasks:
  - id: build_inventory
    type: io.kestra.plugin.core.flow.Subflow
    namespace: solutions.ansible
    flowId: ansible_build_inventory
    wait: true
    transmitFailed: true
    inputs:
      region: "{{ inputs.region }}"
      role: "{{ inputs.role }}"
      platform: "{{ inputs.platform }}"

  - id: precheck
    type: io.kestra.plugin.core.flow.Subflow
    namespace: solutions.ansible
    flowId: ansible_job_template
    wait: true
    transmitFailed: true
    inputs:
      git_url: "{{ vars.git_url }}"
      git_ref: "{{ inputs.git_ref }}"
      playbook_dir: "{{ vars.playbook_dir }}"
      playbook: 01_precheck.yml
      inventory: "{{ outputs.build_inventory.outputs.inventory }}"
      extra_vars: "{{ render(vars.extra_vars) }}"
      simulate: "{{ inputs.simulate }}"

  - id: approval
    type: io.kestra.plugin.core.flow.Pause
    runIf: "{{ inputs.require_approval }}"
    description: |
      Review the pre-check before resuming. It records the software running on each
      switch in this execution's precheck outputs.
    onResume:
      - id: approved
        type: BOOL
        defaults: true
      - id: comment
        type: STRING
        defaults: Pre-check reviewed

  - id: rejected
    type: io.kestra.plugin.core.execution.Fail
    runIf: "{{ inputs.require_approval and not outputs.approval.onResume.approved }}"
    errorMessage: "Rollout rejected: {{ outputs.approval.onResume.comment }}"

  - id: change
    type: io.kestra.plugin.core.flow.Loop
    description: One playbook at a time, in list order. The first failure stops the rest.
    values: "{{ inputs.playbooks }}"
    concurrencyLimit: 1
    tasks:
      - id: run_playbook
        type: io.kestra.plugin.core.flow.Subflow
        namespace: solutions.ansible
        flowId: ansible_job_template
        wait: true
        transmitFailed: true
        inputs:
          git_url: "{{ vars.git_url }}"
          git_ref: "{{ inputs.git_ref }}"
          playbook_dir: "{{ vars.playbook_dir }}"
          playbook: "{{ item.value }}"
          inventory: "{{ outputs.build_inventory.outputs.inventory }}"
          extra_vars: "{{ render(vars.extra_vars) }}"
          check_mode: "{{ inputs.dry_run }}"
          simulate: "{{ inputs.simulate }}"

  - id: validate
    type: io.kestra.plugin.core.flow.Subflow
    runIf: "{{ not inputs.dry_run }}"
    namespace: solutions.ansible
    flowId: ansible_job_template
    wait: true
    transmitFailed: true
    inputs:
      git_url: "{{ vars.git_url }}"
      git_ref: "{{ inputs.git_ref }}"
      playbook_dir: "{{ vars.playbook_dir }}"
      playbook: 04_validate.yml
      inventory: "{{ outputs.build_inventory.outputs.inventory }}"
      extra_vars: "{{ render(vars.extra_vars) }}"
      simulate: "{{ inputs.simulate }}"

  - id: stamp_assets
    type: io.kestra.plugin.core.flow.Loop
    runIf: "{{ not inputs.dry_run }}"
    description: Only the keys listed here change; the rest of each asset's metadata is kept.
    values: "{{ fromJson(outputs.build_inventory.outputs.hosts) }}"
    tasks:
      - id: stamp
        type: io.kestra.plugin.core.log.Log
        message: "{{ item.value }} rolled out by {{ execution.id }}"
        assets:
          inputs:
            - id: "{{ item.value }}"
          outputs:
            - id: "{{ item.value }}"
              type: io.kestra.plugin.ee.assets.NetworkDevice
              metadata:
                last_rollout: "{{ execution.startDate }}"
                last_rollout_execution: "{{ execution.id }}"
                last_rollout_playbooks: "{{ inputs.playbooks | join(',') }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ inputs.dry_run ? 'DRY RUN' : 'ROLLOUT' }} complete on {{ fromJson(outputs.build_inventory.outputs.hosts) | length }} switches
      ({{ inputs.simulate ? 'lab mode' : 'live devices' }}):
      {{ fromJson(outputs.build_inventory.outputs.hosts) | join(', ') }}
      Steps: 01_precheck.yml, {{ inputs.playbooks | join(', ') }}{{ inputs.dry_run ? '' : ', 04_validate.yml' }}
      Pre-check versions: {{ outputs.precheck.outputs.results }}

errors:
  - id: rollout_failed
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Switch rollout {{ execution.id }} failed. Assets were not stamped. Open the failed subflow execution for the Ansible host results."
