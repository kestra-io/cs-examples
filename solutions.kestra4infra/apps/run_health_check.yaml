id: k4i-run-health-check
namespace: solutions.kestra4infra
type: io.kestra.plugin.ee.apps.Execution
flowId: run_health_check

displayName: Check an application
description: "Calls the application's health endpoint and records the result."
tags:
  - kestra4infra
  - day-2
  - operations

access:
  type: PRIVATE
  catalog: true

layout:
  - on: OPEN
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ## Check an application

          Calls the application's health endpoint and records the result.

          _Demo environment: pick the result. `degraded` opens an incident with its blast radius on its own._

      - type: io.kestra.plugin.ee.apps.execution.blocks.CreateExecutionForm

      - type: io.kestra.plugin.ee.apps.execution.blocks.CreateExecutionButton
        text: Check
        style: INFO

  - on: RUNNING
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ## Checking:

      - type: io.kestra.plugin.ee.apps.execution.blocks.Gantt

  - on: SUCCESS
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ## Done

      - type: io.kestra.plugin.ee.apps.execution.blocks.Logs
        filter:
          taskIds:
            - check
      - type: io.kestra.plugin.ee.apps.execution.blocks.Assets
        filter:
          include:
            - kestra4infra.HealthCheck

  - on: FAILURE
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ## Check an application: failed

      - type: io.kestra.plugin.ee.apps.core.blocks.Stacktrace

      - type: io.kestra.plugin.ee.apps.execution.blocks.Logs
        filter:
          logLevel: ERROR
