id: k4i-rotate-service-account
namespace: solutions.kestra4infra
type: io.kestra.plugin.ee.apps.Execution
flowId: rotate_service_account

displayName: Rotate a service account password
description: "Sets a new password, stores it in Vault and restarts the application that runs as the account."
tags:
  - kestra4infra
  - day-2
  - security

access:
  type: PRIVATE
  catalog: true

layout:
  - on: OPEN
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ## Rotate a service account password

          Sets a new password, stores it in Vault and restarts the application that runs as the account.

          Also runs on its own 7 days before the password expires (`service_account_autorotate`).

      - type: io.kestra.plugin.ee.apps.execution.blocks.CreateExecutionForm

      - type: io.kestra.plugin.ee.apps.execution.blocks.CreateExecutionButton
        text: Rotate
        style: INFO

  - on: RUNNING
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ## Rotating:

      - type: io.kestra.plugin.ee.apps.execution.blocks.Gantt

  - on: SUCCESS
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ## Done

      - type: io.kestra.plugin.ee.apps.execution.blocks.Logs
        filter:
          taskIds:
            - rotate
            - restart_application
      - type: io.kestra.plugin.ee.apps.execution.blocks.Assets
        filter:
          include:
            - kestra4infra.ServiceAccount

  - on: FAILURE
    blocks:
      - type: io.kestra.plugin.ee.apps.core.blocks.Markdown
        content: |
          ## Rotate a service account password: failed

      - type: io.kestra.plugin.ee.apps.core.blocks.Stacktrace

      - type: io.kestra.plugin.ee.apps.execution.blocks.Logs
        filter:
          logLevel: ERROR
