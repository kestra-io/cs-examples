id: service_account_autorotate
namespace: solutions.kestra4infra

labels:
  kestra4infra: "true"
  lifecycle: trigger

description: |
  Asset lifecycle trigger: a service account whose password expires within 7 days is rotated, and
  its application restarted.

  The account's TTL is the password expiry. Provision with a short `password_max_age_days` (say 5)
  to see it fire.

triggers:
  - id: expiring
    type: io.kestra.plugin.ee.assets.TtlTrigger
    on: EXPIRING
    expiresWithin: P7D
    namespace: solutions.kestra4infra
    assetType: kestra4infra.ServiceAccount

tasks:
  - id: announce
    type: io.kestra.plugin.core.log.Log
    message: "{{ trigger.asset.id }} password expires {{ trigger.asset.ttl }}: rotating it."

  - id: rotate
    type: io.kestra.plugin.core.flow.Subflow
    namespace: solutions.kestra4infra
    flowId: rotate_service_account
    wait: true
    transmitFailed: true
    inputs:
      account: "{{ trigger.asset.id }}"
