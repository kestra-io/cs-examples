id: rotate_service_account
namespace: solutions.kestra4infra

labels:
  kestra4infra: "true"
  lifecycle: day-2

description: |
  Rotate a service account's password before it expires, then restart what runs as it.

  Offered on every service account, and started on its own by `service_account_autorotate` when a
  password gets within 7 days of its expiry: the account's TTL is the password expiry date. The
  application that runs as the account is found from the deployment, and restarted.

  **Simulated**: no directory is called; the production tasks are in comments.

inputs:
  - id: account
    type: SELECT
    displayName: Service account
    required: false
    autoSelectFirst: true
    expression: >-
      {{ assets(namespace='solutions.kestra4infra', type='kestra4infra.ServiceAccount')
      | jq('[ .[] | select(.status != "destroyed") | .id ] | sort_by(. != "' ~ (labels.assetId ??? '') ~ '")')
      | first }}

  - id: max_age_days
    type: INT
    displayName: Password age (days)
    defaults: 90
    min: 1

variables:
  target: "{{ labels.system.assetId ??? inputs.account ?? '' }}"

tasks:
  - id: no_target
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ render(vars.target) is empty }}"
    errorMessage: Run this from a service account's action button, or pick one from the list.

  - id: current
    type: io.kestra.plugin.core.output.OutputValues
    values:
      sam: "{{ assets(namespace='solutions.kestra4infra', type='kestra4infra.ServiceAccount') | jq('.[] | select(.id == \"' ~ render(vars.target) ~ '\") | .metadata.sam_account_name') | first }}"
      dep: "{{ assets(namespace='solutions.kestra4infra', type='kestra4infra.ServiceAccount') | jq('.[] | select(.id == \"' ~ render(vars.target) ~ '\") | .partOf.id') | first }}"
      expires: "{{ now() | dateAdd(amount=inputs.max_age_days, unit='DAYS', format='iso_milli', timeZone='UTC') }}"

  - id: rotate
    type: io.kestra.plugin.core.log.Log
    message: |
      Setting a new password on {{ outputs.current.values.sam }} and writing it to vault:kv/apps/{{ outputs.current.values.dep }}/svc (simulated).
      Next expiry: {{ outputs.current.values.expires }}.
    assets:
      inputs:
        - id: k4i-ad-domain
      outputs:
        - type: kestra4infra.ServiceAccount
          id: "{{ render(vars.target) }}"
          namespace: solutions.kestra4infra
          status: active
          ttl: "{{ outputs.current.values.expires }}"
          metadata:
            password_last_set: "{{ now(format='iso_milli', timeZone='UTC') }}"
            password_expires_at: "{{ outputs.current.values.expires }}"
            rotated_by: "{{ trigger.flowId ??? labels.system.username ??? 'api' }}"
  # - id: rotate
  #   type: io.kestra.plugin.scripts.powershell.Commands
  #   commands:
  #     - Set-ADAccountPassword -Identity {{ outputs.current.values.sam }} -Reset -NewPassword (ConvertTo-SecureString $env:NEW -AsPlainText -Force)

  - id: restart_application
    type: io.kestra.plugin.core.log.Log
    message: "Restarting {{ outputs.current.values.dep }}-app on its servers so it picks up the new credential (simulated)."
    assets:
      inputs:
        - id: "{{ render(vars.target) }}"
      outputs:
        - type: kestra4infra.Application
          id: "{{ outputs.current.values.dep }}-app"
          namespace: solutions.kestra4infra
          metadata:
            last_restart_at: "{{ now(format='iso_milli', timeZone='UTC') }}"
            last_restart_reason: service account password rotated

  - id: update_deployment
    type: io.kestra.plugin.core.log.Log
    message: "Recording the new password expiry on {{ outputs.current.values.dep }}."
    assets:
      outputs:
        - type: io.kestra.plugin.ee.assets.Deployment
          id: "{{ outputs.current.values.dep }}"
          namespace: solutions.kestra4infra
          metadata:
            svc_password_expires_at: "{{ outputs.current.values.expires }}"
