id: 05-compose-ztp-provisioning
namespace: solutions.network
description: |
  # Zero-Touch Provisioning (ZTP) — Core Orchestration Flow

  End-to-end onboarding workflow for a new network device. Takes a device from
  CMDB registration through config generation, compliance validation, human approval,
  config push, and post-provision verification.

  **This is the flow that replaces:**
  - 400 lines of Ansible playbooks
  - 3 Python scripts glued together with cron
  - A Teams thread for approval
  - A manual spreadsheet for audit trail

  **Stages:**
  1. Fetch device profile from CMDB KV store
  2. Generate vendor-specific base config (Cisco / Juniper / Arista)
  3. Run compliance validation gate (calls flow 03 as subflow)
  4. Human approval gate (Pause — resolved via the Network Ops App)
  5. Push configuration to device
  6. Post-provision smoke tests
  7. Update CMDB status → active

labels:
  chapter: "05-compose"
  demo: network-orchestration

inputs:
  - id: device_hostname
    type: STRING
    description: "Target device hostname — must be registered in CMDB"
    defaults: "core-rtr-emea-01"
  - id: vendor
    type: SELECT
    values:
      - Cisco
      - Juniper
      - Arista
    defaults: Cisco
    description: "Device vendor — determines which config template is rendered"
  - id: region
    type: SELECT
    values:
      - EMEA
      - AMER
      - APAC
      - MEA
    defaults: EMEA
  - id: change_ticket
    type: STRING
    description: "ServiceNow change ticket reference (e.g. CHG0042137)"
    defaults: "CHG0042137"
  - id: skip_approval
    type: BOOLEAN
    defaults: false
    description: "Bypass approval gate — only for automated overnight provisioning batches"

tasks:
  - id: fetch_device_profile
    type: io.kestra.plugin.core.kv.Get
    description: |
      Reads the latest device inventory from the CMDB sync flow (04).
      If the key is expired or absent, the flow fails fast with a clear diagnostic message.
    key: "NETWORK_DEVICE_INVENTORY"
    errorOnMissing: false

  - id: generate_base_config
    type: io.kestra.plugin.core.flow.Switch
    description: |
      Routes to the vendor-appropriate configuration generator.

      Cisco   → IOS-XE Jinja2 template
      Juniper → JunOS set-format template
      Arista  → EOS CLI template

      All three share the same output contract (device_config.txt) — vendor
      differences are fully encapsulated. The calling flow is vendor-agnostic.
    value: "{{ inputs.vendor }}"
    cases:
      Cisco:
        - id: render_cisco_config
          type: io.kestra.plugin.scripts.python.Script
          description: "Renders Cisco IOS-XE base configuration from the Jinja2 template library."
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
          containerImage: python:3.12-slim
          script: |
            hostname = "{{ inputs.device_hostname }}"
            ticket   = "{{ inputs.change_ticket }}"
            config = f"""!
            ! Generated by Kestra ZTP — {ticket}
            ! Do not edit manually — managed by flow 05-compose-ztp-provisioning
            !
            hostname {hostname}
            ip domain-name network.demo.internal
            !
            interface GigabitEthernet0/0
              description Uplink — auto-provisioned by Kestra ZTP
              ip address 10.1.1.1 255.255.255.0
              no shutdown
            !
            ntp server 10.0.0.1
            ntp server 10.0.0.2
            snmp-server community kestra-demo RO
            !
            end
            """
            print("Rendered Cisco IOS-XE configuration:")
            print(config)
            with open("device_config.txt", "w") as f:
                f.write(config)
          outputFiles:
            - "device_config.txt"

      Juniper:
        - id: render_juniper_config
          type: io.kestra.plugin.scripts.python.Script
          description: "Renders Junos set-format configuration."
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
          containerImage: python:3.12-slim
          script: |
            hostname = "{{ inputs.device_hostname }}"
            ticket   = "{{ inputs.change_ticket }}"
            config = f"""# Generated by Kestra ZTP — {ticket}
            set system host-name {hostname}
            set system domain-name network.demo.internal
            set interfaces ge-0/0/0 description "Uplink — auto-provisioned by Kestra ZTP"
            set interfaces ge-0/0/0 unit 0 family inet address 10.2.1.1/24
            set protocols bgp group EBGP neighbor 10.2.1.254 peer-as 65001
            set snmp community kestra-demo authorization read-only
            """
            print("Rendered Junos set-format configuration:")
            print(config)
            with open("device_config.txt", "w") as f:
                f.write(config)
          outputFiles:
            - "device_config.txt"

      Arista:
        - id: render_arista_config
          type: io.kestra.plugin.scripts.python.Script
          description: "Renders Arista EOS CLI configuration."
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
          containerImage: python:3.12-slim
          script: |
            hostname = "{{ inputs.device_hostname }}"
            ticket   = "{{ inputs.change_ticket }}"
            config = f"""!
            ! Generated by Kestra ZTP — {ticket}
            hostname {hostname}
            !
            interface Ethernet1
              description Uplink — auto-provisioned by Kestra ZTP
              ip address 10.3.1.1/24
              no shutdown
            !
            router bgp 65002
              neighbor 10.3.1.254 remote-as 65001
              neighbor 10.3.1.254 description SPINE-UPLINK
            !
            """
            print("Rendered Arista EOS configuration:")
            print(config)
            with open("device_config.txt", "w") as f:
                f.write(config)
          outputFiles:
            - "device_config.txt"

  - id: run_validation_gate
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Inline validation gate — equivalent to calling flow 03 as a subflow.

      **This is modularity in action.** In production, this calls flow 03 as a Subflow.
      For demo: inline to avoid multiline-input limitations when calling subflows.

      Checks: device reachability · config syntax · compliance policy · blast radius.
      Failure here means nothing reaches the device.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: tutorial_default
    containerImage: python:3.12-slim
    script: |
      import urllib.request, json, re
      device = "{{ inputs.device_hostname }}"

      # 1. Reachability check (NetBox mock as proxy for device management API)
      req = urllib.request.Request(
          f"http://netbox-mock:8000/api/dcim/devices/",
          headers={"Authorization": "Token nb-demo-token-airbus"}
      )
      with urllib.request.urlopen(req) as r:
          data = json.loads(r.read())
      known = [d["name"] for d in data.get("results", [])]
      if device not in known:
          raise SystemExit(f"VALIDATION FAILED: {device} not found in CMDB")
      print(f"✅ Reachability: {device} found in CMDB")

      # 2. Compliance policy
      config = "interface GigabitEthernet0/0\n  description Uplink\n  ip address 10.1.1.1 255.255.255.0\n  no shutdown"
      if "description" not in config:
          raise SystemExit("POLICY VIOLATION: interface missing description")
      if re.search(r"\btelnet\b", config, re.IGNORECASE):
          raise SystemExit("POLICY VIOLATION: telnet not allowed")
      print("✅ Compliance policy: PASS")

      # 3. Blast radius
      blast = {"directly_affected_cis": 3, "risk_level": "LOW", "rollback_time_s": 120}
      print(f"✅ Blast radius: {blast['directly_affected_cis']} CIs | {blast['risk_level']}")
      print(f"\nVALIDATION PASSED — execution {{ execution.id }} is proof-of-validation")

  - id: approval_gate
    type: io.kestra.plugin.core.flow.If
    description: |
      Checks whether human approval is required.
      Automated overnight batches (skip_approval=true) bypass this gate.
      All daytime changes require approval via the Network Ops App.
    condition: "{{ inputs.skip_approval == false }}"
    then:
      - id: await_security_approval
        type: io.kestra.plugin.core.flow.Pause
        description: |
          **Human-in-the-loop gate.**

          Execution pauses here. The on-call engineer and change manager receive a
          notification with a direct link to the Network Ops App, where they see:
          - The generated device configuration
          - Blast radius report (3 CIs, LOW risk)
          - Change ticket reference

          This replaces the email/Teams approval chain that took 2–4 hours.
          The App makes it a 30-second decision with a full audit record.
        onResume:
          - id: decision
            type: SELECT
            description: "Review the generated config and blast radius, then approve or reject."
            values:
              - Approve
              - Reject
          - id: approver_notes
            type: STRING
            description: "Optional notes — required if rejecting"

  - id: deploy_or_reject
    type: io.kestra.plugin.core.flow.If
    description: "Routes to deployment or rejection based on approver decision."
    condition: "{{ inputs.skip_approval or outputs.await_security_approval.onResume.decision == 'Approve' }}"
    then:
      - id: push_config_to_device
        type: io.kestra.plugin.scripts.python.Script
        description: |
          Connects to the device via NAPALM (vendor-agnostic network automation library)
          and applies the generated configuration atomically.

          In production: NETCONF for Juniper, SSH/RESTCONF for Cisco, eAPI for Arista.
          On failure: NAPALM `discard_config()` — device state is unchanged.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        script: |
          import time, json
          device  = "{{ inputs.device_hostname }}"
          vendor  = "{{ inputs.vendor }}"
          ticket  = "{{ inputs.change_ticket }}"

          print(f"Connecting to {device} ({vendor}) via NAPALM...")
          time.sleep(1)
          print("Applying configuration (atomic commit)...")
          time.sleep(1)

          result = {
              "device": device, "vendor": vendor,
              "change_ticket": ticket,
              "execution_id": "{{ execution.id }}",
              "status": "SUCCESS", "lines_applied": 14
          }
          print(json.dumps(result, indent=2))

      - id: run_smoke_tests
        type: io.kestra.plugin.core.http.Request
        description: |
          Post-provision smoke tests: routing table, interface state, NTP sync, SNMP.
          In production: NAPALM get_facts() + get_interfaces() + get_bgp_neighbors().
        uri: "http://netbox-mock:8000/health"
        method: GET
        allowFailure: true

      - id: update_cmdb_status
        type: io.kestra.plugin.core.log.Log
        description: |
          Updates device status in NetBox: planned → active.
          In production: PATCH https://netbox.internal/api/dcim/devices/{id}/
        message: |
          CMDB UPDATE | {{ inputs.device_hostname }} | planned → active
          Change ticket {{ inputs.change_ticket }} resolved as COMPLETED.
          Execution: {{ execution.id }}

    else:
      - id: log_rejection
        type: io.kestra.plugin.core.log.Log
        message: |
          ZTP REJECTED | {{ inputs.device_hostname }} | {{ inputs.change_ticket }}
          Reason: {{ outputs.await_security_approval.onResume.approver_notes | default("No notes provided") }}
          Device state: UNCHANGED. Requestor notified.

errors:
  - id: handle_failure
    type: io.kestra.plugin.core.log.Log
    description: |
      On any failure, the device state is unchanged — NAPALM's atomic commit model
      guarantees no partial configuration. The operator can rerun from any checkpoint.
    message: |
      ZTP FAILED | {{ inputs.device_hostname }} | {{ inputs.change_ticket }}
      Device state : UNCHANGED (atomic rollback)
      Action       : Review error, fix root cause, rerun from checkpoint.
      Execution    : {{ execution.id }}
