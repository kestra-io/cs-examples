id: cleanup_license_dependant_vms
namespace: company.team

triggers:
  - id: onLicenseDeletion
    type: io.kestra.plugin.core.trigger.Flow
    inputs:
      license: "{{ trigger.outputs.licenseId }}"
    dependsOn:
      - flowId: delete_license
        namespace: company.team
        states: [SUCCESS]
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "dynatrace-webhook"

inputs:
  - id: license
    type: SELECT
    # v2 rejects a flow whose Webhook or Schedule trigger cannot resolve a
    # required input. The Flow trigger supplies this one; the webhook does not,
    # so it resolves to null on that path. Wire it to the webhook payload if
    # the webhook is meant to purge a specific license.
    required: false
    expression: "{{ assets(type = 'io.kestra.plugin.ee.assets.VM.License') | jq('.[].id') }}"

tasks:
  - id: hello
    type: io.kestra.plugin.kestra.ee.assets.PurgeAssets
    allowFailure: true
    endDate: "{{ now() | dateAdd(-90, 'DAYS') }}"
    assetType:
      - io.kestra.plugin.ee.assets.VM
    metadataQuery:
      - field: licenseId
        type: EQUAL_TO
        value: "{{ inputs.license }}"


labels:
  - key: feature
    value: assets