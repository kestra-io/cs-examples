id: cleanup_license_dependant_vms
namespace: company.team

triggers:
  - id: onLicenseDeletion
    type: io.kestra.plugin.core.trigger.Flow
    inputs:
      license: "{{ trigger.outputs.licenseId }}"
    dependsOn:
      - flowId: delete_license
        namespace: company.team
        states: [SUCCESS]
  - id: webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "dynatrace-webhook"
    # v2 rejects a flow whose trigger cannot resolve a required input. The Flow
    # trigger supplies `license` already; without this the webhook path left it
    # null. Dynatrace posts the licence being retired in the request body.
    inputs:
      license: "{{ trigger.body.licenseId }}"

inputs:
  - id: license
    type: SELECT
    expression: "{{ assets(type = 'io.kestra.plugin.ee.assets.VM.License') | jq('.[].id') }}"

tasks:
  - id: hello
    type: io.kestra.plugin.kestra.ee.assets.PurgeAssets
    allowFailure: true
    endDate: "{{ now() | dateAdd(-90, 'DAYS') }}"
    assetType:
      - io.kestra.plugin.ee.assets.VM
    metadataQuery:
      - field: licenseId
        type: EQUAL_TO
        value: "{{ inputs.license }}"


labels:
  - key: feature
    value: assets