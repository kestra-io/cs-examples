id: dynamic_dag_router
namespace: solutions.data

inputs:
  - id: nodes
    type: SELECT
    displayName: How many child nodes do you want to spawn?
    autoSelectFirst: true
    values:
      - "0"
      - "1"
      - "2"
      - "3"

tasks:
  - id: loop_nodes
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ range(1, inputs.nodes | number) }}"
    tasks:
      - id: trigger_node
        type: io.kestra.plugin.core.flow.Subflow
        flowId: dynamic_dag_exec
        namespace: foo
        wait: false
